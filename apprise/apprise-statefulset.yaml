apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apprise-api
  namespace: general-services
  labels:
    app.kubernetes.io/name: apprise-api
spec:
  selector:
    matchLabels:
      app: apprise-api
  serviceName: "apprise-api"
  replicas: 1
  minReadySeconds: 1
  template:
    metadata:
      labels:
        app: apprise-api
      annotations:
        linkerd.io/inject: enabled
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: apprise-api
        image: lscr.io/linuxserver/apprise-api:v2.2.0-ls272
        ports:
        - name: apprise-api
          containerPort: 8000
        env:
          - name: TZ
            value: America/Los_Angeles
          - name: PUID
            value: '1000'
          - name: PGID
            value: '1000'
        readinessProbe:
          httpGet:
            path: /status
            port: apprise-api
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /status
            port: apprise-api
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            memory: "536870912"
          requests:
            cpu: 250m
            memory: "268435456"
        volumeMounts:
          - name: apprise-pvc
            mountPath: /config
          - name: attachments
            mountPath: /attachments
      volumes:
        - name: attachments
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
  - metadata:
      name: apprise-pvc
      namespace: general-services
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "do-block-storage"
      resources:
        requests:
          storage: 2Gi