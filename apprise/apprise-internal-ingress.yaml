apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apprise-internal
  namespace: general-services
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: internal
spec:
  ingressClassName: traefik
  rules:
    - host: apprise.sfo2.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apprise-api
                port:
                  number: 8000