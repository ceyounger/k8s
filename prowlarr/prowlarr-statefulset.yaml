apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prowlarr
  namespace: media-services
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  selector:
    matchLabels:
      app: prowlarr
  serviceName: "prowlarr"
  replicas: 1
  minReadySeconds: 1
  template:
    metadata:
      labels:
        app: prowlarr
      annotations:
        linkerd.io/inject: enabled
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:3.1.0
        ports:
        - name: prowlarr
          containerPort: 9696
        env:
          - name: TZ
            value: America/Los_Angeles
          - name: PUID
            value: '1024'
          - name: PGID
            value: '65540'
        readinessProbe:
          httpGet:
            path: /ping
            port: prowlarr
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /ping
            port: prowlarr
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            memory: "536870912"
          requests:
            cpu: 250m
            memory: "268435456"
        volumeMounts:
          - mountPath: /config
            name: prowlarr-pvc
  volumeClaimTemplates:
  - metadata:
      name: prowlarr-pvc
      namespace: media-services
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "do-block-storage"
      resources:
        requests:
          storage: 2Gi