apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr-internal
  namespace: media-services
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: internal
spec:
  ingressClassName: traefik
  rules:
    - host: prowlarr.sfo2.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  number: 9696