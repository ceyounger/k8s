apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: media-services
  labels:
    app.kubernetes.io/name: seerr
  annotations:
    keel.sh/policy: major
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@weekly"    
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seerr
  strategy:
    type: Recreate      
  template:
    metadata:
      labels:
        app: seerr
      annotations:	
        linkerd.io/inject: enabled        
    spec:
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:latest
          imagePullPolicy: Always
          env:
          - name: TZ
            value: America/Los_Angeles           
          ports:
            - name: seerr
              containerPort: 5055
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: 5055
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: 5055
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: 5055
            failureThreshold: 6
            periodSeconds: 5
            timeoutsSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: "536870912"
            requests:
              cpu: 250m
              memory: "134217728"
          volumeMounts:
            -  name: seerr-volume
               mountPath: /app/config
      volumes:
        - name: seerr-volume
          persistentVolumeClaim:
            claimName: seerr-pvc
      restartPolicy: Always
