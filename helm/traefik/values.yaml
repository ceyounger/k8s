deployment:
  replicas: 1
image:
  tag: v3.7
ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
    - websecure
    matchRule: Host(`traefik.taius.io`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
    middlewares:
    - name: dashboard-auth
    services:
    - kind: TraefikService
      name: api@internal
metrics:
  prometheus:
    enabled: true
    entryPoint: metrics
ports:
  metrics:
    expose:
      default: false
    port: 9100
  traefik:
    expose:
      default: false
    port: 8080
  web:
    expose:
      default: true
    port: 8000
  websecure:
    expose:
      default: true
    port: 8443
  # NEW: private entrypoint, served only by the internal load balancer
  internal:
    port: 8001
    exposedPort: 80
    protocol: TCP
    expose:
      default: false
      internal: true
providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
service:
  type: LoadBalancer
  # NEW: second Service backed by a DigitalOcean internal load balancer
  additionalServices:
    internal:
      annotations:
        service.beta.kubernetes.io/do-loadbalancer-network: "INTERNAL"
      spec:
        type: LoadBalancer