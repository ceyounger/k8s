deployment:
  replicas: 2   # CHANGED: was 1
image:
  tag: v3.7
ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
    - websecure
    matchRule: Host(`traefik.taius.io`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
    middlewares:
    - name: dashboard-auth
    services:
    - kind: TraefikService
      name: api@internal
metrics:
  prometheus:
    enabled: true
    entryPoint: metrics
# NEW: never let a node drain take both replicas down
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# NEW: put the two replicas on different nodes
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: traefik-traefik
ports:
  metrics:
    expose:
      default: false
    port: 9100
  traefik:
    expose:
      default: false
    port: 8080
  web:
    expose:
      default: true
    port: 8000
  websecure:
    expose:
      default: true
    port: 8443
  internal:
    port: 8001
    exposedPort: 80
    protocol: TCP
    expose:
      default: false
      internal: true
providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
service:
  type: LoadBalancer
  # NEW: keep the real client IP on the public load balancer
  spec:
    externalTrafficPolicy: Local
  additionalServices:
    internal:
      annotations:
        service.beta.kubernetes.io/do-loadbalancer-network: "INTERNAL"
      spec:
        type: LoadBalancer